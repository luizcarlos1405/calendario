<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1C1C1E">
  <title>Calendário de Luta · Dourados/MS</title>
  <meta name="description" content="A linha de atividades em Dourados/MS até o segundo turno — mande a mensagem ou o panfleto de cada uma pelo WhatsApp.">
  <!-- Link preview (WhatsApp, Telegram, redes sociais). Crawlers don't run JS, so these stay static and use absolute URLs. -->
  <link rel="canonical" href="https://calendario.rsensato.com/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Calendário de Luta">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:url" content="https://calendario.rsensato.com/">
  <meta property="og:title" content="Calendário de Luta · Dourados/MS">
  <meta property="og:description" content="As atividades em Dourados/MS até o 2º turno, com mensagem e panfleto prontos para o WhatsApp.">
  <meta property="og:image" content="https://calendario.rsensato.com/assets/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Calendário de Luta: a linha vermelha de atividades até a eleição de 25/10.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='8' y='2' width='4' height='8' rx='2' fill='%23E4002B'/%3E%3Crect x='20' y='2' width='4' height='8' rx='2' fill='%23E4002B'/%3E%3Crect x='3' y='6' width='26' height='23' rx='4' fill='%23E4002B'/%3E%3Cg fill='%23fff'%3E%3Crect x='3' y='12' width='26' height='2.5'/%3E%3Crect x='7.5' y='17.5' width='4.5' height='3.5' rx='1'/%3E%3Crect x='13.75' y='17.5' width='4.5' height='3.5' rx='1'/%3E%3Crect x='20' y='17.5' width='4.5' height='3.5' rx='1'/%3E%3Crect x='7.5' y='23' width='4.5' height='3.5' rx='1'/%3E%3Crect x='13.75' y='23' width='4.5' height='3.5' rx='1'/%3E%3C/g%3E%3C/svg%3E">
  <!-- Installable app (PWA): manifest + sw.js. Icons are rendered from assets/icon.html. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Calendário">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="preload" href="fonts/barlow-condensed-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/barlow-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/flyers.css">
  <script defer src="js/vendor/html-to-image.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="sign">
    <div class="sign-inner">
      <a class="brand" href="./">
        <span class="brand-mark" id="brand-mark"></span>
        <span class="brand-text">
          <span class="brand-name" id="app-name">Calendário de Luta</span>
          <span class="brand-city" id="app-city">Dourados/MS</span>
        </span>
      </a>
      <p class="countdown" id="countdown" hidden></p>
    </div>
  </header>
  <div class="route-strip" aria-hidden="true"></div>

  <div class="shell">
    <main class="line-col" id="main">
      <div id="notice" class="notice" role="status" hidden></div>

      <section class="next" id="next" aria-label="Próxima atividade" hidden></section>

      <div class="controls">
        <div class="view-tabs" role="tablist" aria-label="Visualização">
          <button type="button" role="tab" id="tab-line" data-view="line" aria-controls="view">Linha</button>
          <button type="button" role="tab" id="tab-month" data-view="month" aria-controls="view">Mês</button>
        </div>
        <div class="filters" id="filters" role="group" aria-label="Filtrar por tipo"></div>
      </div>

      <div id="view" class="view" role="tabpanel" aria-live="polite">
        <p class="placeholder">Carregando agenda…</p>
      </div>
    </main>

    <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>

    <aside class="bench" id="bench" aria-labelledby="bench-title" tabindex="-1">
      <div class="bench-empty" id="bench-empty">
        <span class="bench-empty-ring" aria-hidden="true"></span>
        <p>Escolha uma atividade na linha para montar a mensagem e o panfleto.</p>
      </div>

      <div class="bench-body" id="bench-body" hidden>
        <header class="bench-head">
          <h2 id="bench-title"></h2>
          <button type="button" class="icon-btn bench-close" id="bench-close" aria-label="Fechar"></button>
        </header>
        <div class="cancel-note" id="bench-cancel" hidden></div>
        <dl class="facts" id="bench-facts"></dl>

        <div class="seg" role="tablist" aria-label="Formato">
          <button type="button" role="tab" id="seg-message" data-panel="message" aria-controls="panel-message">Mensagem</button>
          <button type="button" role="tab" id="seg-flyer" data-panel="flyer" aria-controls="panel-flyer">Panfleto</button>
        </div>

        <section class="panel" id="panel-message" role="tabpanel" aria-labelledby="seg-message">
          <div class="chat">
            <div class="bubble" id="bubble"></div>
          </div>
          <div class="actions">
            <a class="btn btn-route" id="wa-link" target="_blank" rel="noopener"></a>
            <button type="button" class="btn btn-line" id="copy-btn"></button>
          </div>
        </section>

        <section class="panel" id="panel-flyer" role="tabpanel" aria-labelledby="seg-flyer" hidden>
          <div class="style-picker" id="style-picker">
            <button type="button" class="icon-btn" id="style-prev" aria-label="Estilo anterior"></button>
            <div class="style-select">
              <label class="sr-only" for="style-select">Estilo do panfleto</label>
              <select id="style-select"></select>
              <span class="style-count" id="style-count" aria-hidden="true"></span>
            </div>
            <button type="button" class="icon-btn" id="style-next" aria-label="Próximo estilo"></button>
          </div>
          <div class="flyer-frame" id="flyer-frame">
            <div class="flyer-scaler" id="flyer-scaler"></div>
          </div>
          <div class="actions">
            <button type="button" class="btn btn-route" id="share-btn" hidden></button>
            <button type="button" class="btn btn-line" id="download-btn"></button>
          </div>
          <p class="hint" id="flyer-hint">Imagem 1080 × 1350, no formato do WhatsApp e do Instagram.</p>
        </section>
      </div>
    </aside>
  </div>

  <script>
    // Browsers block JS modules and the CSV when the page is opened straight from disk.
    if (location.protocol === 'file:') {
      var notice = document.getElementById('notice');
      notice.dataset.kind = 'error';
      notice.innerHTML = '<strong>O site precisa ser aberto por um servidor, não direto do arquivo.</strong> ' +
        'Na pasta do projeto, rode <code>python3 -m http.server 8000</code> e acesse <code>http://localhost:8000</code>.';
      notice.hidden = false;
      document.getElementById('view').replaceChildren();
    }
  </script>
</body>
</html>
